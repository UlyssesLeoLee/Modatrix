[workspace]
resolver = "3"
members = ["crates/ff3d-domain", "crates/ff3d-api"]
default-members = ["crates/ff3d-domain", "crates/ff3d-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v4", "serde"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
