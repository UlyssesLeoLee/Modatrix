[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge3d-agent-service"
version = "0.1.0"
description = "Official LangGraph orchestration service for FrameForge 3D"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "langgraph==1.2.18",
  "langgraph-checkpoint==4.3.1",
  "langgraph-checkpoint-postgres==3.2.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
